services:

  mysql:
    image: mysql:8.0
    container_name: product-mysql

    environment:
      MYSQL_ROOT_PASSWORD: "@root"
      MYSQL_DATABASE: product_management_db

    ports:
      - "3307:3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p@root"]
      interval: 5s
      timeout: 5s
      retries: 10

  product-service:
    image: product-management-system:latest
    container_name: product-service

    ports:
      - "8080:8080"

    depends_on:
      mysql:
        condition: service_healthy